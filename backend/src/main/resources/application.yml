spring:
  application:
    name: greenops-control-center
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/motiva_verde}
    username: ${SPRING_DATASOURCE_USERNAME:motiva}
    password: ${SPRING_DATASOURCE_PASSWORD:motiva123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    demo-user:
      username: ${APP_AUTH_DEMO_USERNAME:motiva.admin}
      password: ${APP_AUTH_DEMO_PASSWORD:motiva@123}
      full-name: ${APP_AUTH_DEMO_FULL_NAME:Portfolio Operator}
      role: ${APP_AUTH_DEMO_ROLE:MANAGER}
    jwt-secret: ${APP_AUTH_JWT_SECRET:greenops-control-center-jwt-secret-2026-safe-key}
    token-expiration-hours: ${APP_AUTH_TOKEN_EXPIRATION_HOURS:12}
  weather:
    provider: openweather
    api-key: ${OPENWEATHER_API_KEY:}
    base-url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
